<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugam Occupying Domain</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.box {
    text-align: center;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    width: 90%;
    max-width: 350px;
}

h1 {
    color: #ff4d6d;
    font-size: 22px;
}

button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
}

#yesBtn {
    background: #ff4d6d;
    color: white;
}

#noBtn {
    background: #ccc;
    position: fixed;
}

#message {
    margin-top: 20px;
    font-size: 20px;
    color: #28a745;
}
</style>
</head>

<body>

<div class="box">
    <h1>Will you go on a date with me? 💕</h1>
    <button id="yesBtn" onclick="sayYes()">Yes 😍</button>
    <button id="noBtn">No 😜</button>
    <div id="message"></div>
</div>

<script>
const noBtn = document.getElementById("noBtn");

// Move button (works for hover + touch + click)
function moveButton() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 60);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

// Desktop
noBtn.addEventListener("mouseover", moveButton);

// Mobile (important)
noBtn.addEventListener("touchstart", function(e) {
    e.preventDefault(); // stops click
    moveButton();
});

// Backup (if clicked somehow)
noBtn.addEventListener("click", moveButton);

function sayYes() {
    document.getElementById("message").innerHTML =
        "Yayyy!! 💖 Let's gooo solukhumbu😍✨";
}
</script>

</body>
</html>
