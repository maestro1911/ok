<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>sugamm occupying domain haha</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.box {
    text-align: center;
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
    color: #ff4d6d;
}

button {
    padding: 12px 25px;
    margin: 10px;
    border: none;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
}

#yesBtn {
    background: #ff4d6d;
    color: white;
}

#yesBtn:hover {
    background: #e63950;
}

#noBtn {
    background: #ccc;
    position: absolute;
}

#message {
    margin-top: 20px;
    font-size: 22px;
    color: #28a745;
}
</style>
</head>

<body>

<div class="box">
    <h1>Will you go on a date with me? 💕</h1>
    <button id="yesBtn" onclick="sayYes()">Yes 😍</button>
    <button id="noBtn" onmouseover="moveButton()">No 😜</button>
    <div id="message"></div>
</div>

<script>
function moveButton() {
    const btn = document.getElementById("noBtn");
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

function sayYes() {
    document.getElementById("message").innerHTML =
        "Yayyy!! 💖 Let's gooo 😍✨";
}
</script>

</body>
</html>
