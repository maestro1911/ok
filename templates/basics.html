<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Leaflet.js - Geomatics</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css&quot; integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
   
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js&quot; integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

        <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .controls { margin-bottom: 15px; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        input { margin-right: 10px; padding: 5px; }
        button { padding: 6px 12px; cursor: pointer; }
        #map { height: 500px; width: 100%; border: 2px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Geomatics Web Mapping with Leaflet</h1>
   
    <div class="controls">
        <strong>Location Check:</strong>
        <input id="mylocation" type="text" placeholder="Input a location name">
        <button onclick="showLocationName()">Alert Location</button>
    </div>

    <div class="controls">
        <strong>Zoom to Coordinate:</strong>
        <!-- Changed input type to "number" to restrict text input -->
        <input type="number" id="ptlat" placeholder="Enter Latitude (e.g. 27.67)">
        <input type="number" id="ptlng" placeholder="Enter Longitude (e.g. 85.37)">
        <button id="zoomToPt" onclick="zoomToCoordinate()">Zoom to Lat/Lng</button>
    </div>

    <!-- The Map Container -->
    <div id="map"></div>

    <script>
        // 1. Define our Survey Point Object
        const surveyPointA = {
            pointID: "BM-101",
            latitude: 27.6756,  
            longitude: 85.3781,  
            elevation: 1320.5,    
            getCoordinates: function() {
                return `Lat: ${this.latitude}, Lon: ${this.longitude}`;
            }
        };

        // 2. Initialize the Map
        // We use our object's coordinates to center the map in Nepal instead of London!
        const map = L.map('map').setView([surveyPointA.latitude, surveyPointA.longitude], 13);

        // 3. Add the Base Map Tiles (OpenStreetMap)
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>&#39;
        }).addTo(map);

        // 4. Add a marker for our survey point so we can see it
        L.marker([surveyPointA.latitude, surveyPointA.longitude])
            .addTo(map)
            .bindPopup(`<b>${surveyPointA.pointID}</b><br>Elevation: ${surveyPointA.elevation}m`)
            .openPopup();

        // 5. Function to alert the location name
        const showLocationName = function() {
            const locationInput = document.querySelector('#mylocation').value;
            if (locationInput) {
                alert(`You entered: ${locationInput}`);
            } else {
                alert("Please enter a location first!");
            }
        };

        // 6. Function to zoom to user-input coordinates
        const zoomToCoordinate = function() {
            // Grab the values and convert them to numbers
            const lat = parseFloat(document.querySelector('#ptlat').value);
            const lng = parseFloat(document.querySelector('#ptlng').value);
           
            // Validation: Ensure the user actually entered valid numbers
            if (!isNaN(lat) && !isNaN(lng)) {
                console.log(`Zooming to Latitude: ${lat}, Longitude: ${lng}`);
                map.setView([lat, lng], 14);
               
                // Bonus: Drop a new marker at the location they zoomed to
                L.marker([lat, lng]).addTo(map).bindPopup("User defined point").openPopup();
            } else {
                alert("Please enter valid numerical coordinates for both Latitude and Longitude.");
            }
        }
    </script>
</body>
</html>
