<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency Hospital Finder</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#eef3f7;
    text-align:center;
    padding:40px;
}
.container{
    max-width:550px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}
h1{
    color:#0066cc;
}
button{
    padding:12px 24px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background:#0066cc;
    color:white;
    cursor:pointer;
}
button:hover{
    background:#004d99;
}
#result{
    margin-top:25px;
    font-size:18px;
    line-height:1.8;
}
</style>
</head>

<body>

<div class="container">
    <h1>Nearest Major Hospital Finder</h1>
    <p>Find nearby hospitals with surgery / emergency facilities.</p>

    <button onclick="findHospital()">Find Hospital</button>

    <div id="result"></div>
</div>

<script>
function findHospital(){

let hospitals = [

{name:"Dhulikhel Hospital", lat:27.6220, lon:85.5476},
{name:"Tribhuvan University Teaching Hospital", lat:27.7362, lon:85.3305},
{name:"Bir Hospital", lat:27.7048, lon:85.3135},
{name:"Grande International Hospital", lat:27.7420, lon:85.3370},
{name:"Norvic International Hospital", lat:27.6905, lon:85.3158},
{name:"Patan Hospital", lat:27.6727, lon:85.3256},
{name:"B&B Hospital", lat:27.6582, lon:85.3246}

];

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(function(position){

let userLat = position.coords.latitude;
let userLon = position.coords.longitude;

let nearest = hospitals[0];
let minDistance = getDistance(userLat,userLon,nearest.lat,nearest.lon);

for(let i=1;i<hospitals.length;i++){

let distance = getDistance(
userLat,userLon,
hospitals[i].lat,
hospitals[i].lon
);

if(distance < minDistance){
minDistance = distance;
nearest = hospitals[i];
}
}

document.getElementById("result").innerHTML =
"<b>Nearest Major Hospital:</b><br>" +
nearest.name +
"<br><b>Distance:</b> " +
minDistance.toFixed(2) + " km";

},

function(){
alert("Allow location access.");
});

}else{
alert("Geolocation not supported.");
}
}

function getDistance(lat1,lon1,lat2,lon2){

let R = 6371;

let dLat = (lat2-lat1) * Math.PI/180;
let dLon = (lon2-lon1) * Math.PI/180;

let a =
Math.sin(dLat/2)*Math.sin(dLat/2) +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLon/2)*Math.sin(dLon/2);

let c = 2 * Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R * c;
}
</script>

</body>
</html>
